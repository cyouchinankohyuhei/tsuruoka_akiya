<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSURUOKA AKIYA AUDIT & COST</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #F2EFE9; color: #333333; font-family: 'Noto Serif JP', serif; line-height: 1.8; }
        .en { font-family: 'Cormorant Garamond', serif; font-style: italic; }
        .item-card { border-bottom: 1px solid #D1CDC7; padding: 1.5rem 0; }
        .advice-box { background-color: #EAE5DD; border-radius: 4px; font-size: 0.75rem; color: #666; margin-top: 0.5rem; padding: 0.75rem; }
        .camera-label { display: inline-flex; align-items: center; background: #333; color: white; padding: 6px 12px; border-radius: 2px; font-size: 10px; cursor: pointer; margin-top: 10px; }
        .preview-img { width: 50px; height: 50px; object-fit: cover; border-radius: 2px; margin-top: 5px; }
        
        input[type="checkbox"] {
            appearance: none; width: 22px; height: 22px; border: 1px solid #888; border-radius: 50%;
            cursor: pointer; position: relative; vertical-align: middle; flex-shrink: 0;
        }
        input[type="checkbox"]:checked { background-color: #888; }
        input[type="checkbox"]:checked::after {
            content: ''; position: absolute; top: 5px; left: 5px; width: 10px; height: 10px; border-radius: 50%; background: #F2EFE9;
        }
        /* PDF出力用のスタイル調整 */
        #pdf-content { background-color: white; }
    </style>
</head>
<body class="p-6 md:p-12 pb-40">

    <header class="max-w-3xl mx-auto mb-16">
        <p class="en text-xl mb-2 opacity-60">Audit & Cost Simulation</p>
        <h1 class="text-3xl tracking-widest leading-snug">鶴岡空き家内見<br>プロフェッショナル・ナビ</h1>
        <p class="text-[10px] mt-4 opacity-50">建築士・電気工事士・設備士による31項目診断</p>
    </header>

    <main id="audit-form" class="max-w-3xl mx-auto space-y-20">
        <section>
            <h2 class="en text-2xl mb-6 border-b border-black pb-2 italic text-slate-700">01 Site & Exterior</h2>
            <div class="space-y-1">
                <div class="item-card flex flex-col">
                    <div class="flex items-start">
                        <input type="checkbox" id="m1" data-label="前面道路幅員" data-pro="0" data-diy="0"><label for="m1" class="ml-4 text-sm font-semibold">前面道路の幅員（4m以上、除雪車の進入可否）</label>
                    </div>
                </div>
                <div class="item-card flex flex-col">
                    <div class="flex items-start">
                        <input type="checkbox" id="m2" data-label="駐車場拡幅" data-pro="300000" data-diy="50000"><label for="m2" class="ml-4 text-sm font-semibold">駐車場の有無・拡幅（軽から普通車への対応）</label>
                    </div>
                </div>
                <div class="item-card flex flex-col">
                    <div class="flex items-start">
                        <input type="checkbox" id="m7" data-label="雨漏り修繕" data-pro="500000" data-diy="50000"><label for="m7" class="ml-4 text-sm font-bold text-red-800">雨漏りの形跡（天井、小屋裏、壁のシミ）</label>
                    </div>
                    <div class="advice-box">垂木が変色している場合は要注意。DIYはコーキング等の一時しのぎとなります。</div>
                </div>
                </div>
            <label class="camera-label"><span>📷 写真を撮影</span><input type="file" accept="image/*" capture="environment" class="hidden" onchange="preview(this)"></label>
            <div class="flex gap-2 mt-2"></div>
        </section>
    </main>

    <div class="fixed bottom-0 left-0 w-full p-8 bg-[#F2EFE9]/90 backdrop-blur-md flex justify-center border-t border-zinc-200 gap-4">
        <button onclick="calculate()" class="bg-black text-white px-8 py-5 tracking-[0.3em] text-[10px] hover:bg-zinc-800 transition shadow-2xl uppercase">Generate Report</button>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-zinc-900/95 flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div id="pdf-area" class="bg-[#F2EFE9] p-8 md:p-12 max-w-lg w-full shadow-2xl my-auto">
            <h2 class="serif text-xl mb-8 tracking-widest text-center border-b border-zinc-300 pb-4">内見診断レポート</h2>
            
            <div class="space-y-6 mb-10">
                <div class="flex justify-between items-baseline border-b border-zinc-200 pb-2">
                    <span class="text-xs opacity-60">① 業者発注概算</span>
                    <span id="proCost" class="text-xl font-bold">¥0</span>
                </div>
                <div class="flex justify-between items-baseline border-b border-orange-200 pb-2">
                    <span class="text-xs text-orange-800">② DIY併用概算</span>
                    <span id="diyCost" class="text-2xl font-bold text-orange-800">¥0</span>
                </div>
                <div id="checked-items-summary" class="text-[10px] text-zinc-600 space-y-1">
                    </div>
            </div>

            <div id="finalPhotos" class="flex flex-wrap gap-2 mb-10"></div>

            <div class="flex flex-col gap-3">
                <button onclick="savePDF()" class="bg-zinc-700 text-white py-4 text-[10px] tracking-[0.2em] uppercase">Download PDF Report</button>
                <button onclick="sendLine()" class="bg-[#06C755] text-white py-4 text-[10px] tracking-[0.2em] uppercase">Send to LINE</button>
                <button onclick="location.reload()" class="text-[10px] tracking-widest opacity-60 underline mt-4">再入力</button>
            </div>
        </div>
    </div>

    <script>
        function preview(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                const container = input.parentElement.nextElementSibling;
                reader.onload = e => {
                    const img = document.createElement('img');
                    img.src = e.target.result; img.className = 'preview-img';
                    container.appendChild(img);
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        let reportText = "";

        function calculate() {
            let totalPro = 0; let totalDiy = 0;
            let checkedItems = [];
            document.querySelectorAll('input:checked').forEach(c => {
                totalPro += parseInt(c.dataset.pro || 0);
                totalDiy += parseInt(c.dataset.diy || 0);
                checkedItems.push("・" + c.dataset.label);
            });

            document.getElementById('proCost').innerText = "¥" + totalPro.toLocaleString();
            document.getElementById('diyCost').innerText = "¥" + totalDiy.toLocaleString();
            
            const summaryArea = document.getElementById('checked-items-summary');
            summaryArea.innerHTML = "<strong>指摘事項:</strong><br>" + checkedItems.join('<br>');

            // LINE送信用テキストの生成
            reportText = `【空き家内見レポート】\n業者概算: ¥${totalPro.toLocaleString()}\nDIY併用: ¥${totalDiy.toLocaleString()}\n\n指摘事項:\n${checkedItems.join('\n')}`;

            const photoSummary = document.getElementById('finalPhotos');
            photoSummary.innerHTML = "";
            document.querySelectorAll('.preview-img').forEach(img => {
                const clone = img.cloneNode();
                clone.style.width = "70px"; clone.style.height = "70px";
                photoSummary.appendChild(clone);
            });

            document.getElementById('modal').classList.remove('hidden');
        }

        // PDF保存機能
        function savePDF() {
            const element = document.getElementById('pdf-area');
            const opt = {
                margin: 10,
                filename: 'Tsuruoka_Akiya_Report.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        // LINE送信機能
        function sendLine() {
            // LINE公式アカウントのリンク（ご自身のURLに書き換えてください）
            const lineUrl = "https://line.me/R/ti/p/@YOUR_ID"; 
            
            // テキストをクリップボードにコピーして通知
            navigator.clipboard.writeText(reportText).then(() => {
                alert("診断結果をコピーしました。LINEが開いたらペーストして送信してください。");
                window.location.href = lineUrl;
            });
        }
    </script>
</body>
</html>
