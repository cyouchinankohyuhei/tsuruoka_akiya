<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>つるおか空き家・お宝発見ナビ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #fcfaf5; color: #333; }
        .h-serif { font-family: 'Noto Serif JP', serif; }
        .accent-border { border-left: 4px solid #d3381c; }
        .check-item:checked + label { color: #d3381c; font-weight: bold; }
        .btn-grad { background: linear-gradient(135deg, #e65c00 0%, #d3381c 100%); }
        /* 白ごはん.com風の柔らかい影 */
        .card-shadow { box-shadow: 0 2px 15px rgba(0,0,0,0.04); }
    </style>
</head>
<body>

    <header class="bg-white py-8 px-4 text-center border-b border-orange-100 card-shadow">
        <div class="inline-block border-2 border-slate-800 p-2 mb-4">
            <div class="text-2xl">🏠🔅</div>
        </div>
        <h1 class="h-serif text-2xl tracking-wider mb-2">つるおか空き家・お宝発見ナビ</h1>
        <p class="text-xs text-slate-500 tracking-widest">建築士・設備士が教える、後悔しない家探し</p>
    </header>

    <main class="max-w-xl mx-auto px-5 py-10">
        
        <section class="mb-12 text-center">
            <h2 class="h-serif text-lg mb-4 text-slate-700">その空き家は、お宝か。</h2>
            <p class="text-sm text-slate-600 leading-relaxed">
                鶴岡の古い家には、今の家では手に入らない魅力が眠っています。<br>
                直感で見つけた「好き」と、プロの視点での「安心」を、<br>
                このナビでチェックしてみましょう。
            </p>
        </section>

        <div class="mb-10">
            <h3 class="accent-border pl-3 h-serif text-lg mb-6">1. あなたの「いいな」を大切に</h3>
            <div class="grid grid-cols-1 gap-4">
                <div class="bg-white p-5 rounded-lg card-shadow flex items-start">
                    <input type="checkbox" id="fav1" class="w-6 h-6 mt-1 accent-orange-600" data-score="10">
                    <label for="fav1" class="ml-4 cursor-pointer">
                        <span class="block font-bold text-slate-800">古い建具・ガラスが可愛い</span>
                        <span class="block text-xs text-slate-500 mt-1">大正ロマンを感じる結霜ガラスや職人技の組子細工。</span>
                    </label>
                </div>
                <div class="bg-white p-5 rounded-lg card-shadow flex items-start">
                    <input type="checkbox" id="fav2" class="w-6 h-6 mt-1 accent-orange-600" data-score="10">
                    <label for="fav2" class="ml-4 cursor-pointer">
                        <span class="block font-bold text-slate-800">庭や景色に心惹かれる</span>
                        <span class="block text-xs text-slate-500 mt-1">手入れのしがいがある庭、窓から見える庄内の山々。</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="mb-10">
            <h3 class="accent-border pl-3 h-serif text-lg mb-6">2. パッと見の「健康状態」</h3>
            <div class="space-y-4">
                <div class="bg-white p-5 rounded-lg card-shadow flex items-start">
                    <input type="checkbox" id="risk1" class="w-6 h-6 mt-1 accent-slate-600" data-risk="15">
                    <label for="risk1" class="ml-4 cursor-pointer">
                        <span class="block font-bold text-slate-800">玄関を開けた時の「におい」</span>
                        <span class="block text-xs text-slate-500 mt-1">カビ臭い、または湿っぽい感じがしませんか？</span>
                    </label>
                </div>
                <div class="bg-white p-5 rounded-lg card-shadow flex items-start">
                    <input type="checkbox" id="risk2" class="w-6 h-6 mt-1 accent-slate-600" data-risk="15">
                    <label for="risk2" class="ml-4 cursor-pointer">
                        <span class="block font-bold text-slate-800">床が沈む・フカフカする</span>
                        <span class="block text-xs text-slate-500 mt-1">特にキッチンや洗面所などの水回りを歩いてみてください。</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="mb-16">
            <h3 class="accent-border pl-3 h-serif text-lg mb-6 text-slate-700">3. 【プロの眼】見えない部分</h3>
            <div class="bg-slate-800 text-white p-6 rounded-2xl shadow-xl space-y-5">
                <div class="flex items-start">
                    <input type="checkbox" id="pro1" class="w-6 h-6 mt-1 accent-orange-400" data-risk="30">
                    <label for="pro1" class="ml-4 cursor-pointer">
                        <span class="block font-bold text-orange-300">基礎の割れ・建物の歪み</span>
                        <span class="block text-[11px] opacity-80 mt-1">建築士視点：雪の重みや地盤沈下の兆候を確認。</span>
                    </label>
                </div>
                <div class="flex items-start">
                    <input type="checkbox" id="pro2" class="w-6 h-6 mt-1 accent-orange-400" data-risk="20">
                    <label for="pro2" class="ml-4 cursor-pointer">
                        <span class="block font-bold text-orange-300">分電盤・ガス配管の劣化</span>
                        <span class="block text-[11px] opacity-80 mt-1">設備士視点：現代の家電に耐えられるか、安全性を診断。</span>
                    </label>
                </div>
            </div>
        </div>

        <button onclick="showResult()" class="w-full btn-grad text-white h-serif py-5 rounded-full text-lg shadow-lg hover:opacity-90 transition transform active:scale-95">
            診断結果を見る
        </button>

        <section class="mt-24 border-t border-orange-100 pt-10 text-center">
            <div class="w-24 h-24 bg-slate-200 rounded-full mx-auto mb-4 overflow-hidden border-4 border-white shadow-md">
                <img src="https://via.placeholder.com/150" alt="プロフィール写真">
            </div>
            <p class="text-xs tracking-widest text-orange-600 font-bold mb-2">診断サポート・施工管理</p>
            <p class="h-serif text-xl mb-4 text-slate-800">あなたの名前</p>
            <div class="inline-flex space-x-2 mb-6">
                <span class="text-[10px] bg-slate-100 px-2 py-1 rounded">二級建築士</span>
                <span class="text-[10px] bg-slate-100 px-2 py-1 rounded">電気工事士</span>
                <span class="text-[10px] bg-slate-100 px-2 py-1 rounded">ガス設備士</span>
            </div>
            <p class="text-xs text-slate-500 leading-relaxed px-4">
                鶴岡の風土に合った、安全で魅力的な暮らしをご提案します。<br>
                リノベーションのご相談からインフラ整備まで、一貫してお任せください。
            </p>
        </section>

    </main>

    <div id="resultModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-6 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
            <p id="resIcon" class="text-6xl mb-4"></p>
            <h2 id="resTitle" class="h-serif text-2xl mb-4"></h2>
            <p id="resText" class="text-sm text-slate-600 leading-relaxed mb-8"></p>
            <a href="https://line.me" class="block w-full btn-grad text-white py-4 rounded-xl font-bold mb-3">公式LINEで無料相談</a>
            <button onclick="closeModal()" class="text-slate-400 text-xs">閉じる</button>
        </div>
    </div>

    <script>
        function showResult() {
            let score = 0; let risk = 0;
            document.querySelectorAll('input:checked').forEach(el => {
                if(el.dataset.score) score += parseInt(el.dataset.score);
                if(el.dataset.risk) risk += parseInt(el.dataset.risk);
            });

            const icon = document.getElementById('resIcon');
            const title = document.getElementById('resTitle');
            const text = document.getElementById('resText');

            if (risk >= 40) {
                icon.innerText = "🏗";
                title.innerText = "磨けば光る「原石」";
                text.innerText = "魅力もありますが、インフラの大幅な改修が必要です。プロの技術で安全を確保すれば、一生モノの家になります。まずは詳細な見積もりを。";
            } else if (score >= 20) {
                icon.innerText = "💎";
                title.innerText = "出会えたらラッキー！";
                text.innerText = "非常に魅力が高く、リスクも抑えられています。鶴岡でも珍しい物件です。早めに具体的な活用プランを立てましょう。";
            } else {
                icon.innerText = "🏠";
                title.innerText = "まずは基本の点検から";
                text.innerText = "標準的なコンディションです。自分好みに変えていく楽しさがあります。電気やガスなど、生活の基盤から整えていきましょう。";
            }
            document.getElementById('resultModal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('resultModal').classList.add('hidden'); }
    </script>
</body>
</html>
