    <main class="max-w-xl mx-auto px-5 py-10">
        
        <section class="mb-12 text-center">
            <h2 class="h-serif text-lg mb-4 text-slate-700">その空き家は、お宝か。</h2>
            <p class="text-sm text-slate-600 leading-relaxed">
                鶴岡の古い家には、今の家では手に入らない魅力が眠っています。<br>
                直感で見つけた「好き」と、プロの視点での「安心」を、<br>
                このナビでチェックしてみましょう。
            </p>
        </section>

        <div class="mb-10">
            <h3 class="accent-border pl-3 h-serif text-lg mb-6">1. 眠っている「お宝」を探す</h3>
            <div class="grid grid-cols-1 gap-4">
                <div class="bg-white p-5 rounded-lg card-shadow flex items-start">
                    <input type="checkbox" id="fav1" class="w-6 h-6 mt-1 accent-orange-600" data-score="10">
                    <label for="fav1" class="ml-4 cursor-pointer">
                        <span class="block font-bold text-slate-800">立派な梁（はり）や大黒柱</span>
                        <span class="block text-xs text-slate-500 mt-1">ケヤキなどの質の高い木材は、磨けば一生モノの輝きを放ちます。</span>
                    </label>
                </div>
                <div class="bg-white p-5 rounded-lg card-shadow flex items-start">
                    <input type="checkbox" id="fav2" class="w-6 h-6 mt-1 accent-orange-600" data-score="10">
                    <label for="fav2" class="ml-4 cursor-pointer">
                        <span class="block font-bold text-slate-800">情緒ある土間や蔵</span>
                        <span class="block text-xs text-slate-500 mt-1">アトリエやカフェ、趣味のスペースとして活用できる貴重な空間。</span>
                    </label>
                </div>
                <div class="bg-white p-5 rounded-lg card-shadow flex items-start">
                    <input type="checkbox" id="fav3" class="w-6 h-6 mt-1 accent-orange-600" data-score="10">
                    <label for="fav3" class="ml-4 cursor-pointer">
                        <span class="block font-bold text-slate-800">職人技の建具・欄間（らんま）</span>
                        <span class="block text-xs text-slate-500 mt-1">今では再現が難しい、繊細な彫刻や美しい色ガラス。</span>
                    </label>
                </div>
                <div class="bg-white p-5 rounded-lg card-shadow flex items-start">
                    <input type="checkbox" id="fav4" class="w-6 h-6 mt-1 accent-orange-600" data-score="10">
                    <label for="fav4" class="ml-4 cursor-pointer">
                        <span class="block font-bold text-slate-800">庄内の四季を感じる庭</span>
                        <span class="block text-xs text-slate-500 mt-1">柿の木、季節の花々。プライベートな景色は最高の贅沢です。</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="mb-10">
            <h3 class="accent-border pl-3 h-serif text-lg mb-6">2. 建物の「健康状態」を見る</h3>
            <div class="space-y-4">
                <div class="bg-white p-5 rounded-lg card-shadow flex items-start">
                    <input type="checkbox" id="risk1" class="w-6 h-6 mt-1 accent-slate-600" data-risk="10">
                    <label for="risk1" class="ml-4 cursor-pointer">
                        <span class="block font-bold text-slate-800">雨染み・壁の変色</span>
                        <span class="block text-xs text-slate-500 mt-1">天井や壁に不自然なシミはないですか？雨漏りのサインかも。</span>
                    </label>
                </div>
                <div class="bg-white p-5 rounded-lg card-shadow flex items-start">
                    <input type="checkbox" id="risk2" class="w-6 h-6 mt-1 accent-slate-600" data-risk="10">
                    <label for="risk2" class="ml-4 cursor-pointer">
                        <span class="block font-bold text-slate-800">床のたわみ・きしみ</span>
                        <span class="block text-xs text-slate-500 mt-1">歩くとフカフカする場所は、土台の腐食や白蟻の可能性があります。</span>
                    </label>
                </div>
                <div class="bg-white p-5 rounded-lg card-shadow flex items-start">
                    <input type="checkbox" id="risk3" class="w-6 h-6 mt-1 accent-slate-600" data-risk="10">
                    <label for="risk3" class="ml-4 cursor-pointer">
                        <span class="block font-bold text-slate-800">サッシの隙間風・結露</span>
                        <span class="block text-xs text-slate-500 mt-1">鶴岡の冬を越すには、断熱性と窓の気密性が重要です。</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="mb-16">
            <h3 class="accent-border pl-3 h-serif text-lg mb-6 text-slate-700">3. 【専門家】が見抜く深部のリスク</h3>
            <div class="bg-slate-800 text-white p-6 rounded-2xl shadow-xl space-y-6">
                <div class="flex items-start">
                    <input type="checkbox" id="pro1" class="w-6 h-6 mt-1 accent-orange-400" data-risk="20">
                    <label for="pro1" class="ml-4 cursor-pointer">
                        <span class="block font-bold text-orange-300">基礎のひび割れ・軒の歪み</span>
                        <span class="block text-[11px] opacity-80 mt-1">建築士：積雪荷重による構造へのダメージがないかチェック。</span>
                    </label>
                </div>
                <div class="flex items-start">
                    <input type="checkbox" id="pro2" class="w-6 h-6 mt-1 accent-orange-400" data-risk="15">
                    <label for="pro2" class="ml-4 cursor-pointer">
                        <span class="block font-bold text-orange-300">電気容量・アース・コンセント劣化</span>
                        <span class="block text-[11px] opacity-80 mt-1">電気工事士：現代の家電に対応可能か、漏電の危険はないか。</span>
                    </label>
                </div>
                <div class="flex items-start">
                    <input type="checkbox" id="pro3" class="w-6 h-6 mt-1 accent-orange-400" data-risk="15">
                    <label for="pro3" class="ml-4 cursor-pointer">
                        <span class="block font-bold text-orange-300">ガス給湯器・配管・水抜き栓</span>
                        <span class="block text-[11px] opacity-80 mt-1">設備士：冬場の凍結対策やガスの安全基準を満たしているか。</span>
                    </label>
                </div>
            </div>
        </div>

        <button onclick="showResult()" class="w-full btn-grad text-white h-serif py-5 rounded-full text-lg shadow-lg hover:opacity-90 transition transform active:scale-95">
            診断結果を見る
        </button>
